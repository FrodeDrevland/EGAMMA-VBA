name: manual

# Builds the PDF manual that ships inside the release archive.
#
# The PDF has to be committed to the repository rather than attached to the
# GitHub release: Zenodo's GitHub integration deposits the repository zipball
# at the tag and ignores release assets, so anything not tracked at the tag is
# absent from the archival record the DOI points at.
#
# This workflow does not commit anything. It builds the PDF and uploads it as
# a workflow artifact; download it and commit it as part of cutting a release,
# so that a generated file only ever enters the repository deliberately.

on:
  workflow_dispatch:
  push:
    paths:
      # EGAMMA.bas is an input to the build, not just to the library: conf.py
      # reads EGAMMA_LIB_VERSION out of it to stamp the manual's title page.
      - 'EGAMMA.bas'
      - 'docs/**'
      - '.github/workflows/manual.yml'

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: pip install sphinx sphinx_rtd_theme myst_parser

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-plain-generic \
            tex-gyre

      # Warnings are reported but do not fail the build. Run with -W locally if
      # you want them treated as errors.
      - name: Sphinx -> LaTeX
        run: sphinx-build -b latex --keep-going docs/source docs/_latex

      - name: LaTeX -> PDF
        run: make -C docs/_latex LATEXMKOPTS="-interaction=nonstopmode"

      - name: Collect
        run: |
          mkdir -p out
          cp docs/_latex/EGAMMA-VBA-manual.pdf out/EGAMMA-VBA-manual.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: EGAMMA-VBA-manual
          path: out/EGAMMA-VBA-manual.pdf
          if-no-files-found: error

      # Kept only when the build fails, so a LaTeX error can be read without
      # rerunning anything.
      - name: Upload LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            docs/_latex/*.log
            docs/_latex/*.tex
          if-no-files-found: ignore
